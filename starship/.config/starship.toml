add_newline = true
format = "$os$hostname[](fg:#393939 bg:#42be65)$username$git_branch$git_status$directory[](fg:#393939) "

# Green pill: OS icon + host | user (thin gray divider). Purple: git. Gray: cwd.
# Each pill draws its own leading arrow so missing segments leave no gaps.
[os]
disabled = false
format = "[ $symbol]($style)"
style = "fg:#161616 bg:#42be65"

[os.symbols]
NixOS = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Arch = " "
Linux = " "
Macos = " "
Windows = " "
Unknown = " "

[hostname]
ssh_only = false
format = "[$hostname ]($style)"
style = "fg:#161616 bg:#42be65"

[username]
show_always = true
format = "[ $user ]($style)"
style_user = "fg:#161616 bg:#42be65"
style_root = "fg:#161616 bg:#42be65"

# Neutral pill, matching tmux's inactive windows (gray bg, white fg).
# Arrow comes from purple inside a repo (git pill precedes), green otherwise.
[directory]
format = "[](fg:#42be65 bg:#393939)[ $path ]($style)"
repo_root_format = "[](fg:#be95ff bg:#393939)[ $repo_root$path ]($style)"
style = "fg:#f2f4f8 bg:#393939"
repo_root_style = "fg:#f2f4f8 bg:#393939"
truncate_to_repo = true
truncation_length = 3

[git_branch]
format = "[](fg:#42be65 bg:#be95ff)[ $symbol$branch ]($style)"
style = "fg:#161616 bg:#be95ff"
symbol = " "

[git_status]
format = "[$all_status$ahead_behind]($style)"
stashed = ""
style = "fg:#161616 bg:#be95ff"
