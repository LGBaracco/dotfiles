set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
# Forward Ctrl+Shift (and other modified) keys so Neovim can tell <C-S-h> from <C-h>
set -g extended-keys on
set -as terminal-features "*:extkeys"
# Not on HPC (DOTFILES_PROFILE from bash/.bashrc): cluster tmux may lack these options.
if-shell '[ "$DOTFILES_PROFILE" != hpc ]' {
  set -g cursor-style blinking-bar
  # Block cursor while in copy/view mode; restore blinking bar on exit.
  # Also refresh status so the session pill updates immediately.
  set-hook -g pane-mode-changed \
    'if -F "#{pane_in_mode}" "set -p cursor-style block" "set -p cursor-style blinking-bar" ; refresh-client -S'
  # Kitty graphics (snacks.image / Molten plots) are wrapped in DCS passthrough.
  set -g allow-passthrough on
}
# Neovim FocusGained/FocusLost (autoread, image redraw on focus).
set -g focus-events on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g set-clipboard on


unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting
unbind %
bind s split-window -h -c "#{pane_current_path}"
unbind '"'
bind v split-window -v -c "#{pane_current_path}"

# Break pane into its own window
unbind !
bind B break-pane

# Join another window into this one as a pane
bind J command-prompt -p "join window:" "join-pane -s ':%%'"

# Configuration reload
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-S-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape \
  if -F '#{selection_active}' 'send-keys -X clear-selection' 'send-keys -X cancel'
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Oxocarbon theme colors (#{@theme_*} 
set -g @theme_bg "#161616"
set -g @theme_fg "#f2f4f8"
set -g @theme_cyan "#3ddbd9"
set -g @theme_black "#131313"
set -g @theme_gray "#393939"
set -g @theme_purple "#be95ff"
set -g @theme_pink "#ff7eb6"
set -g @theme_red "#ee5396"
set -g @theme_green "#42be65"
set -g @theme_blue "#78a9ff"
set -g @theme_black4 "#525252"

# Status bar
set -g status "on"
set -g status-position top
set -gF status-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g status-justify "left"
set -g status-left-length "150"
set -g status-right-length "10"

# Messages
set -gF message-style "fg=#{@theme_cyan},bg=#{@theme_gray},align=centre"
set -gF message-command-style "fg=#{@theme_cyan},bg=#{@theme_gray},align=centre"

# Panes
set -gF pane-border-style "fg=#{@theme_gray}"
set -gF pane-active-border-style "fg=#{@theme_blue}"

# Windows — connected sharp powerline strip; neutral inactive, accent active
# Note: commas inside #{?...} arms must be written as #, so #[fg=x#,bg=y] stays one branch.
set -gF window-status-activity-style "fg=#{@theme_fg},bg=#{@theme_bg},none"
set -g window-status-separator ""
set -gF window-status-style "fg=#{@theme_fg},bg=#{@theme_bg},none"
# tmux 3.8 defaults this to underscore, which draws a line across the active tab
set -gF window-status-current-style "fg=#{@theme_fg},bg=#{@theme_bg},none"
set -g window-status-format "#{?window_start_flag,#[fg=#{@theme_bg}#,bg=#{@theme_gray}],}#[fg=#{@theme_fg},bg=#{@theme_gray}] #I #W #{E:@seg_agent}#{?window_end_flag,#[fg=#{@theme_gray}#,bg=#{@theme_bg}],}"
set -g window-status-current-format "#{?window_start_flag,#[fg=#{@theme_bg}#,bg=#{@theme_purple}],#[fg=#{@theme_gray}#,bg=#{@theme_purple}]}#[fg=#{@theme_bg},bg=#{@theme_purple}] #I #W #{E:@seg_agent}#{?window_end_flag,#[fg=#{@theme_purple}#,bg=#{@theme_bg}],#[fg=#{@theme_purple}#,bg=#{@theme_gray}]}"

# Statusline: session (then windows). Path and nix pills commented out.
set -g status-interval 1
# Nerd icon in the session pill; hpc.conf blanks it
set -g @icon_session " "
# Session pill: pink on prefix, purple in copy mode, blue otherwise
set -g @seg_session "#{?client_prefix,#[bg=#{@theme_pink}],#{?pane_in_mode,#[bg=#{@theme_purple}],#[bg=#{@theme_blue}]}}#[fg=#{@theme_bg},nobold,nounderscore,noitalics] #{@icon_session}#S #{?client_prefix,#[fg=#{@theme_pink}],#{?pane_in_mode,#[fg=#{@theme_purple}],#[fg=#{@theme_blue}]}}#[bg=#{@theme_bg}] "
# set -g @seg_path "#{?client_prefix,#[fg=#{@theme_pink}],#{?pane_in_mode,#[fg=#{@theme_purple}],#[fg=#{@theme_blue}]}}#[bg=#{@theme_cyan}]#[fg=#{@theme_bg},bg=#{@theme_cyan}] #(~/.config/tmux/abbreviate-path.sh #{pane_current_path}) "
# set -g @seg_nix "#[fg=#{@theme_cyan},bg=#{@theme_green}]#[fg=#{@theme_bg},bg=#{@theme_green}]  #[fg=#{@theme_green},bg=#{@theme_bg}] "
# set -g status-left "#{E:@seg_session}#{E:@seg_path}#{E:@seg_nix}"
set -g status-left "#{E:@seg_session}"
set -g status-right ""

# Modes
set -gF mode-style "fg=#{@theme_blue},bg=#{@theme_black4},bold"

# Agents (desktop only): project session P keeps its Claude agents in session P-agents,
# one window each. Claude hooks (~/.claude/settings.json → agents.sh hook) set @agent_state.
if-shell '[ "$DOTFILES_PROFILE" != hpc ]' {
  # Agent state glyph on window tabs (any window running claude)
  set -g @seg_agent "#{?#{==:#{@agent_state},blocked},#[fg=#{@theme_red}]● ,#{?#{==:#{@agent_state},working},#[fg=#{@theme_yellow}]⦿ ,#{?#{==:#{@agent_state},done},#[fg=#{@theme_green}]○ ,#{?#{@agent_state},○ ,}}}}"
  set -g @theme_yellow "#ffe97b"
  # Active agent: same purple as regular windows (agents.sh also sets it as the agents session's @theme_purple)
  set -g @agents_active "#{@theme_purple}"

  # Powerline strip of this project's agents right after the window list (same shapes).
  # agents.sh status-format splices #{E:@agents_strip} into tmux's default status-format[0].
  set -g @agents_strip "#(~/.config/tmux/agents.sh strip '#S' '#{@theme_bg}' '#{@theme_fg}' '#{@theme_gray}' '#{E:@agents_active}' '#{@theme_red}' '#{@theme_yellow}' '#{@theme_green}')"
  run-shell '~/.config/tmux/agents.sh status-format'

  # prefix a: switch to / back from the agents session
  bind a run-shell "~/.config/tmux/agents.sh toggle"
  # prefix A: agents of this project (state, link into project, kill, …) and actions.
  # No nested clients: an agent is shown in the project by linking its window.
  bind A run-shell "~/.config/tmux/agents.sh menu '#{client_name}'"
}

# HPC overrides (DOTFILES_PROFILE is exported by bash/.bashrc)
if-shell '[ "$DOTFILES_PROFILE" = hpc ]' 'source-file ~/.config/tmux/hpc.conf'
