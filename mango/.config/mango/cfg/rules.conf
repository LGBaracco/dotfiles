# Window rules — mirrors niri cfg/rules.kdl where mango allows

# Brave / VS Code / Emacs open maximized (fake maximize keeps bar/decoration)
windowrule=force_fakemaximize:1,appid:brave-browser
windowrule=force_fakemaximize:1,appid:code
windowrule=force_fakemaximize:1,appid:emacs

# Steam: float non-main windows; silence toast notifications
windowrule=isfloating:1,appid:steam
windowrule=isopensilent:1,appid:steam,title:^notificationtoasts_.*_desktop$

# DMS blur wallpaper layer (best-effort; namespace may differ from niri)
layerrule=noblur:0,layer_name:dms:blurwallpaper
