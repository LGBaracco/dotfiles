set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g set-clipboard on


unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Oxocarbon theme colors (#{@thm_*} — use -F only on style/colour options, never on status formats)
set -g @thm_bg "#161616"
set -g @thm_fg "#f2f4f8"
set -g @thm_cyan "#3ddbd9"
set -g @thm_black "#131313"
set -g @thm_gray "#393939"
set -g @thm_magenta "#be95ff"
set -g @thm_pink "#ff7eb6"
set -g @thm_red "#ee5396"
set -g @thm_green "#42be65"
set -g @thm_yellow "#08bdba"
set -g @thm_blue "#78a9ff"
set -g @thm_orange "#ff7eb6"
set -g @thm_black4 "#525252"

# Status bar
set -g status "on"
set -gF status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -gF message-style "fg=#{@thm_cyan},bg=#{@thm_gray},align=centre"
set -gF message-command-style "fg=#{@thm_cyan},bg=#{@thm_gray},align=centre"

# Panes
set -gF pane-border-style "fg=#{@thm_gray}"
set -gF pane-active-border-style "fg=#{@thm_blue}"

# Windows
set -gF window-status-activity-style "fg=#{@thm_fg},bg=#{@thm_bg},none"
set -g window-status-separator ""
set -gF window-status-style "fg=#{@thm_fg},bg=#{@thm_bg},none"

# Statusline - current window (no -F: #I / path must expand per window at draw time)
set -g window-status-current-format "#[fg=#{@thm_blue},bg=#{@thm_bg}] #I: #[fg=#{@thm_magenta},bg=#{@thm_bg}](✓) #[fg=#{@thm_cyan},bg=#{@thm_bg}]#{b:pane_current_path} #[fg=#{@thm_magenta},bg=#{@thm_bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=#{@thm_blue},bg=#{@thm_bg}] #I: #[fg=#{@thm_fg},bg=#{@thm_bg}]#W"

# Statusline - left side (session once)
set -g status-left "#[fg=#{@thm_bg},bg=#{@thm_blue},nobold,nounderscore,noitalics] #S #[fg=#{@thm_blue},bg=#{@thm_bg}] "

# Statusline - right side (window name + prefix indicator)
set -g status-right "#[fg=#{@thm_blue},bg=#{@thm_bg},nobold,nounderscore,noitalics]#[fg=#{@thm_bg},bg=#{@thm_blue},nobold,nounderscore,noitalics] #[fg=#{@thm_fg},bg=#{@thm_gray}] #W #{?client_prefix,#[fg=#{@thm_magenta}],#[fg=#{@thm_cyan}]}#[bg=#{@thm_gray}]#{?client_prefix,#[bg=#{@thm_magenta}],#[bg=#{@thm_cyan}]}#[fg=#{@thm_bg}] "

# Modes
set -gF clock-mode-colour "#{@thm_blue}"
set -gF mode-style "fg=#{@thm_blue},bg=#{@thm_black4},bold"
