# Touchpad gestures — mirrors niri defaults
# https://niri-wm.github.io/niri/Gestures.html
# https://mangowm.github.io/docs/bindings/mouse-gestures
#
# Directions use natural-scroll feel (drag the canvas), matching niri + natural-scroll.

# 3-finger horizontal: column / view movement
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left

# 3-finger vertical: workspace / tag switch
gesturebind=none,up,3,viewtoright_have_client
gesturebind=none,down,3,viewtoleft_have_client

# 4-finger vertical: overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
