# HPC overrides, sourced from tmux.conf when DOTFILES_PROFILE=hpc.

# No Nerd icons (powerline arrows stay)
set -g @icon_session " "

# Older ncurses on the cluster may lack tmux-256color
if-shell '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal screen-256color'

# Less churn on shared login nodes
set -g status-interval 5
