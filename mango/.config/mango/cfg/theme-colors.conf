# Mango state colors DMS matugen does not write (only border/focus/urgent).
# Keep in sync with theme primary/secondary — current oxocarbon blue:
#   primary #33b1ff · secondary #be95ff · error #ee5396 · outline #525252
# Sourced after dms/colors.conf so these apply on top.

# Maximized / fakemaximize (Brave, Code, Emacs) — match focus/primary (niri has no separate maximize border)
maximizescreencolor=0x33b1ffff

# Other window states (mango-only) — theme-aligned
globalcolor=0xbe95ffff
overlaycolor=0xbe85ffff
scratchpadcolor=0xbe95ffff
splitcolor=0xee5396ff

# Drag insert hint ≈ niri insert-hint; shadow ≈ niri shadow
dropcolor=0x33b1ff80
shadowscolor=0x00000070
rootcolor=0x00000000
