# Input — mirrors niri cfg/input.kdl
# Trackpad options need re-login to fully apply (mango docs).

repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us
xkb_rules_variant=altgr-intl
xkb_rules_options=caps:swapescape

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_accel_speed=0.2
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

sloppyfocus=1
view_current_to_back=1
