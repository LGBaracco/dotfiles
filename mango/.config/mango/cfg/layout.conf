# Layout — scroller is the closest mango equivalent of niri's scrollable columns

# Window effects (aligned with niri/DMS layout)
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=5
blur_params_radius=3
blur_params_noise=0.03
blur_params_saturation=1.0
shadows=1
border_radius=3
focused_opacity=0.86
unfocused_opacity=0.86

animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=200
animation_duration_close=200
animation_duration_move=200
animation_duration_tag=200

# Scroller presets ≈ niri preset-column-widths 0.33 / 0.5 / 0.67
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# Gaps ≈ niri gaps 5 + struts top 8
gappih=5
gappiv=5
gappoh=5
gappov=8
borderpx=1

# DMS-aligned colors (#be95ff / #525252 / #ee5396)
rootcolor=0x00000000
bordercolor=0x525252ff
focuscolor=0xbe95ffff
urgentcolor=0xee5396ff
dropcolor=0xbe95ff80

# Use scroller on all tags (niri-like)
tagrule=id:*,layout_name:scroller

overviewgappi=5
overviewgappo=30
ov_tab_mode=1
