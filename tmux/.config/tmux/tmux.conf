set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on


unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Oxocarbon theme colors
# bg #161616 | fg #f2f4f8 | cyan #3ddbd9 | gray #393939
# magenta #be95ff | blue #78a9ff | green #42be65 | pink #ff7eb6
# red #ee5396 | teal #08bdba | black #131313 | black4 #525252

# Status bar
set -g status "on"
set -g status-style "bg=#161616,fg=#f2f4f8"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=#3ddbd9,bg=#393939,align=centre"
set -g message-command-style "fg=#3ddbd9,bg=#393939,align=centre"

# Panes
set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#78a9ff"

# Windows
set -g window-status-activity-style "fg=#f2f4f8,bg=#161616,none"
set -g window-status-separator ""
set -g window-status-style "fg=#f2f4f8,bg=#161616,none"

# Statusline - current window
set -g window-status-current-format "#[fg=#78a9ff,bg=#161616] #I: #[fg=#be95ff,bg=#161616](✓) #[fg=#3ddbd9,bg=#161616]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=#be95ff,bg=#161616]"

# Statusline - other windows
set -g window-status-format "#[fg=#78a9ff,bg=#161616] #I: #[fg=#f2f4f8,bg=#161616]#W"

# Statusline - right side
set -g status-right "#[fg=#78a9ff,bg=#161616,nobold,nounderscore,noitalics]#[fg=#161616,bg=#78a9ff,nobold,nounderscore,noitalics] #[fg=#f2f4f8,bg=#393939] #W #{?client_prefix,#[fg=#be95ff],#[fg=#3ddbd9]}#[bg=#393939]#{?client_prefix,#[bg=#be95ff],#[bg=#3ddbd9]}#[fg=#161616] #[fg=#f2f4f8,bg=#393939] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "#78a9ff"
set -g mode-style "fg=#78a9ff,bg=#525252,bold"
