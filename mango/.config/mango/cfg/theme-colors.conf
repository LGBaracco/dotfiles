# Mango state colors Dux Shell matugen does not write (only border/focus/urgent).
# Keep in sync with theme primary/secondary — current gruvboxMulti classic-hard-dark, green:
#   primary #b8bb26 · secondary #fe8019 · error #fb4934 · outline #7c6f64
# Sourced after dms/colors.conf so these apply on top.

# Maximized / fakemaximize (Brave, Code, Emacs) — match focus/primary (niri has no separate maximize border)
maximizescreencolor=0xb8bb26ff

# Other window states (mango-only) — theme-aligned
globalcolor=0xfe8019ff
overlaycolor=0xfe8019ff
scratchpadcolor=0xfe8019ff
splitcolor=0xfb4934ff

# Drag insert hint ≈ niri insert-hint; shadow ≈ niri shadow
dropcolor=0xb8bb2680
shadowscolor=0x00000070
rootcolor=0x00000000
