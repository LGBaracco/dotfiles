# DMS shell keybinds — mirrors niri/.config/niri/dms/binds.kdl
# Screenshots use compositor-agnostic `dms screenshot` (niri IPC is niri-only).

bind=ALT+CTRL,Delete,spawn,dms ipc call powermenu toggle
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER+ALT,l,spawn,dms ipc call lock lock

bind=NONE,Print,spawn,dms screenshot full
bind=SUPER+SHIFT,s,spawn,dms screenshot
bind=CTRL+SHIFT,1,spawn,dms screenshot
bind=CTRL+SHIFT,2,spawn,dms screenshot full
bind=CTRL+SHIFT,3,spawn,dms screenshot window

bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 5
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 5
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bind=NONE,XF86AudioMedia,spawn,dms ipc call mpris playPause
bind=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5
bind=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5
