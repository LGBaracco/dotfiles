# Layout — scroller is the closest mango equivalent of niri's scrollable columns
# Gaps / radius / borderpx owned by DMS (dms/layout.conf)
# State colors owned by cfg/theme-colors.conf (after dms/colors.conf)

# Window effects (aligned with niri cfg/rules.kdl blur + opacity)
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=5
blur_params_radius=3
blur_params_noise=0.03
blur_params_saturation=1.0
blur_params_brightness=0.9
blur_params_contrast=0.9
shadows=0
layer_shadows=0
# niri has no window shadows enabled (dms/colors.kdl only sets color if turned on)
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=5
focused_opacity=0.86
unfocused_opacity=0.86
no_border_when_single=0
no_radius_when_single=0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
# 0 = vertical tag switch (niri workspaces are vertical)
tag_animation_direction=0
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
# niri: open/close 200ms; springs ≈ snappy ease-out for move/tag
animation_duration_open=200
animation_duration_close=200
animation_duration_move=200
animation_duration_tag=200
animation_duration_focus=0
# ease-out-quad / ease-out-cubic / critical-spring-ish
animation_curve_open=0.25,0.46,0.45,0.94
animation_curve_close=0.33,1.0,0.68,1.0
animation_curve_move=0.2,0.8,0.2,1.0
animation_curve_tag=0.2,0.8,0.2,1.0
animation_curve_focus=0.46,1.0,0.29,1.0
animation_curve_opafadein=0.25,0.46,0.45,0.94
animation_curve_opafadeout=0.33,1.0,0.68,1.0

# Scroller presets ≈ niri preset-column-widths 0.33 / 0.5 / 0.67
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# Use scroller on all tags (niri-like)
tagrule=id:*,layout_name:scroller

# Overview — niri top-left hot corner
enable_hotarea=1
hotarea_size=10
overviewgappi=5
overviewgappo=30

# niri does not warp the cursor on focus change
warpcursor=0
focus_on_activate=1
drag_tile_to_tile=1
smartgaps=0
